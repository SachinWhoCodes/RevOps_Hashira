name: casefile

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: casefile
      POSTGRES_PASSWORD: casefile
      POSTGRES_DB: casefile
    ports:
      # Localhost only. Override the port in .env if 5433 is taken (then set DATABASE_URL and TEST_DATABASE_URL).
      - "127.0.0.1:${CASEFILE_DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U casefile -d casefile"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: ./backend
    command: uvicorn casefile.api.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://casefile:casefile@db:5432/casefile
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["app"]

  worker:
    build: ./backend
    command: python -m casefile.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://casefile:casefile@db:5432/casefile
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    profiles: ["app"]

volumes:
  pgdata:
